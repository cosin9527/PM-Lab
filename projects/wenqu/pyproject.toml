[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wenqu"
version = "0.1.0"
description = "问渠：轻量跨来源知识检索工具（本地文件 + 飞书快照 → 统一 SQLite 索引 → MCP 检索 + launchd 同步）"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.2.0",
    "watchdog>=4.0.0",
    "jieba>=0.42.1",
    "sqlite-vec>=0.1.3",
    "fastembed>=0.3.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/cosin9527/PM-Lab/tree/main/projects/wenqu"

[project.scripts]
wenqu = "wenqu.cli:main"
wenqu-mcp = "wenqu.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wenqu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
